name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DB_URL:              ${{ secrets.VITE_FIREBASE_DB_URL }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}

          # ── Site identity ──────────────────────────────────────────────────
          # VITE_SITE_URL drives canonical URLs, the sitemap, robots.txt, llms.txt
          # and structured data. It must match the domain connected in AdSense,
          # otherwise the site can be approved and then fail its own canonical
          # check. Set it to the custom domain before applying to AdSense —
          # Google does not approve sites on commonly-used free hosts such as
          # *.github.io.
          VITE_SITE_URL:                     ${{ vars.VITE_SITE_URL || 'https://ravin7990.github.io/daily-bible-verse' }}
          VITE_BASE_PATH:                    ${{ vars.VITE_BASE_PATH || '/daily-bible-verse/' }}

          # ── Monetisation & contact ─────────────────────────────────────────
          # ca-pub-XXXXXXXXXX from AdSense (Account > Settings). Leave empty until
          # the account is approved; the ad script and verification meta stay out
          # of the document entirely while it is.
          VITE_ADSENSE_CLIENT:               ${{ vars.VITE_ADSENSE_CLIENT || '' }}
          VITE_CONTACT_EMAIL:                ${{ vars.VITE_CONTACT_EMAIL || 'contact@bibleverseoftheday.app' }}
          VITE_CONTACT_FORM:                 ${{ vars.VITE_CONTACT_FORM || '' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
