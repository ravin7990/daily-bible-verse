<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2939" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1523" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Canonical is rewritten per-route by the SEO component from VITE_SITE_URL.
      The value here is only what crawlers see before hydration.
    -->
    <link rel="canonical" href="https://ravin7990.github.io/daily-bible-verse/" />

    <!--
      Google AdSense site verification.
      Google supplies the exact tag when you connect the domain in the AdSense
      console (Account > Sites > Add site). Paste it here.

      Do NOT hand-write a ca-pub placeholder: a verification tag with the wrong ID
      fails verification outright, and shipping a fake one makes the site look
      like it is already running broken ads.
    -->

    <!--
      Preconnect to the Firebase and AdSense origins so first paint is not held up
      by DNS + TLS for the auth/storage endpoints.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

    <!--
      Fonts are self-hosted and inlined by the bundler (see src/index.css).
      These preloads fetch them in parallel with the CSS instead of paying a
      render-blocking round trip to fonts.googleapis.com.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/daily-bible-verse/fonts/inter-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/daily-bible-verse/fonts/lora-latin.woff2"
    />

    <title>Bible Verse of the Day | Daily Scripture, Reflection &amp; Prayer</title>
    <meta
      name="description"
      content="Start every day with God's Word. Free daily Bible verse with reflection, prayer and life application, plus 180+ Bible stories, 500+ prayers and a complete 66-book Bible reader."
    />
    <meta
      name="keywords"
      content="bible verse of the day, daily bible verse, verse of the day, bible verses, daily devotional, bible reflection, bible prayer, scripture of the day"
    />
    <meta name="author" content="Bible Verse of the Day" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Security headers ──────────────────────────────────────────────────
      GitHub Pages cannot send custom response headers, so these are declared as
      meta elements instead. A meta CSP is weaker than a header (it does not
      cover `frame-ancestors`, and it cannot stop an already-parked tag), but it
      still constrains where scripts and images may come from, which is what
      limits the damage from an injected tag.

      Build a report-only policy first (Content-Security-Policy-Report-Only) if
      you need to see what a stricter version would break.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://securepubads.g.doubleclick.net https://apis.google.com https://www.gstatic.com https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasestorage.app https://securepubads.g.doubleclick.net https://pagead2.googlesyndication.com;
      frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="x-content-type-options" content="nosniff" />
    <meta name="google-site-verification" content="" />

    <!-- Social / agentic browsing -->
    <meta property="og:site_name" content="Bible Verse of the Day" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- GitHub Pages Single Page App Redirect Support -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
